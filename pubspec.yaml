name: crm_flutter
description: A modern Flutter CRM for client management with offline SQLite and secure storage.
version: 1.3.2+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0+1
  path: ^1.8.3
  path_provider: ^2.1.1
  encrypt: ^5.0.3
  pdf: ^3.10.7
  printing: ^5.11.1
  intl: ^0.18.1
  crypto: ^3.0.3
  google_fonts: ^6.1.0
  file_picker: ^10.3.10
  lucide_icons: 0.257.0
  provider: ^6.1.1
  excel: ^4.0.0
  window_manager: ^0.5.1
  shared_preferences: ^2.5.4
  dio: ^5.9.2
  package_info_plus: ^9.0.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - assets/images/
  #   - assets/icons/
