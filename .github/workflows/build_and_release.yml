name: Build & Release

on:
  push:
    branches:
      - main          # Build on every push to main (optional, can be removed)
    tags:
      - 'v*'          # Trigger a release when a tag like v1.2.3 is pushed

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            artifact: build/linux/x64/release/bundle/AppName-Linux.AppImage
            asset_name: AppName-Linux.AppImage
          - os: macos-latest
            target: macos
            artifact: build/macos/Build/Products/Release/AppName.app
            asset_name: AppName-Mac-Installer.pkg
          - os: windows-latest
            target: windows
            artifact: build/windows/runner/Release/AppName.exe
            asset_name: AppName-Windows-Installer.exe
          # Android (uses ubuntu runner but builds apk)
          - os: ubuntu-latest
            target: android
            artifact: build/app/outputs/flutter-apk/app-release.apk
            asset_name: app-release.apk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'   # or pin a specific version
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # Android specific setup
      - name: Setup Java for Android
        if: matrix.target == 'android'
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Decode keystore (Android)
        if: matrix.target == 'android'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks

      - name: Build Android APK
        if: matrix.target == 'android'
        run: flutter build apk --release

      # Linux build
      - name: Build Linux
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build libgtk-3-dev
          flutter build linux --release
          # Package as AppImage (you'll need a tool like linuxdeploy)
          # This is a simplified example; adjust to your actual packaging script
          # For now we just copy the binary; we'll handle packaging later

      # macOS build
      - name: Build macOS
        if: matrix.target == 'macos'
        run: |
          flutter build macos --release
          # Convert .app to .pkg (use a tool like pkgbuild)
          # Again, placeholder – you'll need a real packaging step

      # Windows build
      - name: Build Windows
        if: matrix.target == 'windows'
        run: |
          flutter build windows --release
          # The artifact is an .exe; if you need an installer, add Inno Setup step

      # Upload artifact for later use in release job
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts (debug)
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          draft: true
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
