# ─────────────────────────────────────────────────────────────────────────────
# Client Manager CRM — GitHub Actions CI/CD Release Pipeline
#
# Trigger: push a version tag  →  git tag v1.2.1 && git push --tags
#
# What it does:
#   1. Sets up Flutter 3 (stable) on a Windows runner
#   2. Runs `flutter analyze` to catch issues before shipping
#   3. Builds the Windows release binary
#   4. Injects the tag version into installer.iss dynamically
#   5. Compiles the Inno Setup installer (ClientManager_Setup.exe)
#   6. Creates a GitHub Release and uploads the installer as an asset
# ─────────────────────────────────────────────────────────────────────────────

name: Release

on:
  push:
    tags:
      - 'v*'   # e.g. v1.2.1, v2.0.0

jobs:
  build-and-release:
    name: Build & Release Windows Installer
    runs-on: windows-latest
    permissions:
      contents: write   # required to create GitHub Releases

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Extract version from tag (strips the 'v' prefix) ──────────────
      #   e.g.  refs/tags/v1.2.1  →  APP_VERSION=1.2.1
      - name: Extract version from tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          echo "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Building version: $version"

      # ── 3. Setup Flutter ─────────────────────────────────────────────────
      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true   # cache the Flutter SDK for faster runs

      # ── 4. Install dependencies ──────────────────────────────────────────
      - name: Install Flutter dependencies
        run: flutter pub get

      # ── 5. Analyze (fail fast on errors) ────────────────────────────────
      - name: Analyze (flutter analyze)
        run: flutter analyze --no-fatal-infos

      # ── 6. Build Windows release ─────────────────────────────────────────
      - name: Build Windows (release)
        run: flutter build windows --release

      # ── 7. Install Inno Setup 6 ──────────────────────────────────────────
      - name: Install Inno Setup 6
        run: choco install innosetup --version=6.3.3 -y --no-progress
        shell: pwsh

      # ── 8. Patch version in installer.iss ───────────────────────────────
      #   Replaces:  #define AppVersion   "1.2.1"
      #   With:      #define AppVersion   "1.2.3"  (from the tag)
      - name: Patch installer version
        shell: pwsh
        run: |
          $content = Get-Content installer.iss -Raw
          $patched = $content -replace '#define AppVersion\s+"[^"]+"', "#define AppVersion   `"$env:APP_VERSION`""
          Set-Content installer.iss -Value $patched
          Write-Host "Installer version set to $env:APP_VERSION"

      # ── 9. Compile Inno Setup installer ─────────────────────────────────
      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Installer compiled successfully:"
          Get-Item "dist\ClientManager_Setup.exe" | Select-Object Name, Length

      # ── 10. Rename installer with version number ─────────────────────────
      - name: Rename installer artifact
        shell: pwsh
        run: |
          $src = "dist\ClientManager_Setup.exe"
          $dst = "dist\ClientManager_Setup_v$env:APP_VERSION.exe"
          Rename-Item $src $dst
          Write-Host "Renamed to: $dst"

      # ── 11. Create GitHub Release + Upload asset ─────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Client Manager v${{ env.APP_VERSION }}"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: dist/ClientManager_Setup_v${{ env.APP_VERSION }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
